<!doctype html><html><head><meta name="viewport" content="width=device-width,initial-scale=1"><style>html,body{margin:0;height:100%;display:flex;width:100%;overflow:hidden}section{width:50%;height:100%;position:relative}section>div{width:100%;height:100%}label{position:absolute;z-index:2;top:8px;left:8px;color:white;background:#111;padding:4px}</style><link rel="stylesheet" href="js/cesium-1.145.0/Widgets/widgets.css"><script>window.CESIUM_BASE_URL='js/cesium-1.145.0/';</script><script src="js/cesium-1.145.0/Cesium.js"></script></head><body><section><label>Propuesta</label><div id="after"></div></section><script>
const C=Cesium;
