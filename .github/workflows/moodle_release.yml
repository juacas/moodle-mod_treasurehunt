name: Release plugin version to Moodle Marketplace

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      tag:
        description: 'Tag to be released (for example, v1.0.7)'
        required: true
        type: string

jobs:
  release-notes:
    runs-on: ubuntu-latest
    outputs:
      content: ${{ steps.notes.outputs.content }}
    steps:
      - name: Checkout release tag
        uses: actions/checkout@v4
        with:
          ref: ${{ inputs.tag || github.ref_name }}

      - name: Read and validate release notes
        id: notes
        run: |
          python3 - <<'PY'
          import os
          import uuid
          from pathlib import Path

          path = Path('RELEASE.md')
          if not path.is_file():
              raise SystemExit('RELEASE.md is required for Moodle Marketplace publication')

          notes = path.read_text(encoding='utf-8').strip()
          if not notes:
              raise SystemExit('RELEASE.md is empty')
          if len(notes) > 10000:
              raise SystemExit(f'RELEASE.md has {len(notes)} characters; the Marketplace limit is 10000')

          delimiter = f'RELEASE_NOTES_{uuid.uuid4().hex}'
          with open(os.environ['GITHUB_OUTPUT'], 'a', encoding='utf-8') as output:
              output.write(f'content<<{delimiter}\n{notes}\n{delimiter}\n')
          print(f'Using {len(notes)} characters from RELEASE.md')
          PY

  release-to-marketplace:
    needs: release-notes
    uses: moodlehq/moodle-plugin-release/.github/workflows/moodle-release.yml@main
    with:
      tag: ${{ inputs.tag || github.ref_name }}
      release_notes: ${{ needs.release-notes.outputs.content }}
    secrets:
      MOODLE_MARKETPLACE_TOKEN: ${{ secrets.MOODLE_MARKETPLACE_TOKEN }}

  release-on-github:
    name: Create GitHub Release
    needs: release-notes
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Checkout release tag
        uses: actions/checkout@v4
        with:
          ref: ${{ inputs.tag || github.ref_name }}

      - name: Package plugin
        env:
          RELEASE_TAG: ${{ inputs.tag || github.ref_name }}
        run: git archive --format=zip --output=treasurehunt.zip "$RELEASE_TAG"

      - name: Create or update GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ inputs.tag || github.ref_name }}
        run: |
          archive="treasurehunt.zip"
          title="Treasure Hunt ${RELEASE_TAG}"

          if gh release view "$RELEASE_TAG" >/dev/null 2>&1; then
            gh release edit "$RELEASE_TAG" --title "$title" --notes-file RELEASE.md
            gh release upload "$RELEASE_TAG" "$archive" --clobber
          else
            gh release create "$RELEASE_TAG" "$archive" \
              --title "$title" \
              --notes-file RELEASE.md \
              --verify-tag
          fi
